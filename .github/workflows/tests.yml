name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pypdf
      - name: Unit tests (offline, fake LLM - no API keys needed)
        run: pytest -q
      - name: QC benchmark (deterministic checks)
        run: python scripts/run_benchmark.py
